name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "094954420758"
  BUCKET: cdp-management-api-docs

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish the API docs site
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        id: build
        uses: DEFRA/cdp-build-action/api-docs-build@main
        with:
          target: site
          base-url: /

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-cdp-api-docs-site-role

      # Assets, then pages, then deletes, since cdp-api-docs can copy the bucket
      # mid-publish. A link to a newly added page may 404 for up to a minute.
      # api/ is excluded: it holds tenant docs, so it's never uploaded or deleted.
      - name: Publish site
        env:
          SRC: ${{ steps.build.outputs.path }}/
        run: |
          aws s3 sync "$SRC" "s3://${BUCKET}/" --exclude "*" --include "assets/*" --no-progress
          aws s3 sync "$SRC" "s3://${BUCKET}/" --exclude "api/*" --no-progress
          aws s3 sync "$SRC" "s3://${BUCKET}/" --delete --exclude "api/*" --no-progress
